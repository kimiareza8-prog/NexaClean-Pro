name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'source/NexaClean_Pro.py'
      - 'source/requirements.txt'
      - '.github/workflows/build-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: source/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r source/requirements.txt
          pip install pyinstaller

      - name: Build standalone EXE
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "NexaClean-Pro" source/NexaClean_Pro.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexaClean-Pro-Windows
          path: dist/NexaClean-Pro.exe
          if-no-files-found: error
