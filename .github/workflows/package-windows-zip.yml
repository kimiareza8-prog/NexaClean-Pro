name: Build One-Click Windows ZIP

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'source/**'
      - '.github/workflows/package-windows-zip.yml'

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create simple user package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -Recurse -Force package -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path package\_NexaClean -Force | Out-Null
          Copy-Item source\NexaClean-Pro-START.bat package\NexaClean-Pro-START.bat
          Copy-Item source\NexaClean_Pro.py package\_NexaClean\NexaClean_Pro.py
          Copy-Item source\requirements.txt package\_NexaClean\requirements.txt
          Copy-Item source\oneclick_setup.ps1 package\_NexaClean\oneclick_setup.ps1
          Set-Content -Path package\_NexaClean\README_INTERNAL.txt -Encoding UTF8 -Value "Internal NexaClean files. For normal use, go back one folder and double-click NexaClean-Pro-START.bat."
          Remove-Item NexaClean-Pro-Windows-v3.5-OneClick.zip -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path package\* -DestinationPath NexaClean-Pro-Windows-v3.5-OneClick.zip -CompressionLevel Optimal

      - name: Commit ZIP to repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NexaClean-Pro-Windows-v3.5-OneClick.zip
          if git diff --cached --quiet; then
            echo "Package is already current."
            exit 0
          fi
          git commit -m "Update one-click Windows package [skip ci]"
          git push
