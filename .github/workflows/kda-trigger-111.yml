name: Trigger KDA signed update 1.1.1

on:
  push:
    branches: [kda-releases]
    paths:
      - '.github/workflows/kda-trigger-111.yml'

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger signed update
        run: |
          curl --fail-with-body --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 180 -sS 'https://www.kimiazivar.com/wp-json/kda/v1/update-trigger?ts=1790067079&nonce=FpZHrQURNz4WeTbJeLbctVBUtLHM1rkq&sig=QbqasPT-6cl_fMZFca0fxfA0G8uIZxcbJgdgCVmCD8t1c49p48qToWvwppw7sDvfgMn-cPmtHF8fLpb4tui0Ag' | tee /tmp/kda-first.json
      - name: Verify after rate-lock window
        run: |
          sleep 35
          curl --fail-with-body --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 180 -sS 'https://www.kimiazivar.com/wp-json/kda/v1/update-trigger?ts=1790067079&nonce=av9ZwLgODvc3hI3qyHOoWGgwh7f6Kfal&sig=NpzufmiEehDyiIbn4Dv4jdumGg4vjF38K1tLJNxkVPOte8lL1jXWqYuiEloGOMD9kh4inY_dBn90wfAhaIrwDA' | tee /tmp/kda-second.json
