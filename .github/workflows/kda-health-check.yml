name: KDA external health check

on:
  push:
    branches: [kda-releases]
    paths:
      - '.github/workflows/kda-health-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Network and HTTP health
        shell: bash
        run: |
          set +e
          echo '=== DNS ==='
          dig +short kimiazivar.com A
          dig +short www.kimiazivar.com A
          echo '--- AAAA ---'
          dig +short kimiazivar.com AAAA
          dig +short www.kimiazivar.com AAAA
          echo '--- CNAME ---'
          dig +short www.kimiazivar.com CNAME
          echo '=== TLS ==='
          timeout 15 openssl s_client -connect www.kimiazivar.com:443 -servername www.kimiazivar.com </dev/null 2>/dev/null | openssl x509 -noout -subject -issuer -dates || true
          echo '=== CURL IPv4 ==='
          curl -4 -I -L --connect-timeout 10 --max-time 25 -sS -w '\nHTTP=%{http_code} connect=%{time_connect} tls=%{time_appconnect} ttfb=%{time_starttransfer} total=%{time_total} ip=%{remote_ip}\n' https://www.kimiazivar.com/ || true
          echo '=== CURL IPv6 ==='
          curl -6 -I -L --connect-timeout 10 --max-time 25 -sS -w '\nHTTP=%{http_code} connect=%{time_connect} tls=%{time_appconnect} ttfb=%{time_starttransfer} total=%{time_total} ip=%{remote_ip}\n' https://www.kimiazivar.com/ || true
          echo '=== REPEATED IPv4 ==='
          for i in 1 2 3 4 5; do
            curl -4 -o /dev/null --connect-timeout 8 --max-time 20 -sS -w "try=$i HTTP=%{http_code} connect=%{time_connect} ttfb=%{time_starttransfer} total=%{time_total} ip=%{remote_ip}\n" https://www.kimiazivar.com/ || echo "try=$i FAILED"
            sleep 2
          done
          echo '=== NON-WWW ==='
          curl -4 -I -L --connect-timeout 10 --max-time 25 -sS -w '\nHTTP=%{http_code} total=%{time_total} ip=%{remote_ip}\n' https://kimiazivar.com/ || true
