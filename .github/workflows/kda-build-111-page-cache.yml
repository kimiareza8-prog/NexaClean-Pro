name: Build KDA 1.1.11 page cache repair

on:
  push:
    branches: [kda-releases]
    paths:
      - '.github/workflows/kda-build-111-page-cache.yml'

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build package
        run: python kda/patches/build111.py
      - name: PHP lint
        run: |
          rm -rf /tmp/kda111lint
          mkdir /tmp/kda111lint
          unzip -q kda/kimiya-diagnostic-agent-v1.1.11.zip -d /tmp/kda111lint
          find /tmp/kda111lint -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Commit package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kda/kimiya-diagnostic-agent-v1.1.11.zip kda/sha256-1.1.11.txt
          git commit -m "Build KDA v1.1.11 page cache repair [skip ci]"
          git push
