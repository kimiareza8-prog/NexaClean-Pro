name: KDA external retest

on:
  push:
    branches: [kda-releases]
    paths:
      - '.github/workflows/kda-external-retest.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Repeat homepage requests
        shell: bash
        run: |
          set +e
          for i in 1 2 3 4 5; do
            curl -4 -o /dev/null --connect-timeout 8 --max-time 20 -sS -w "try=$i HTTP=%{http_code} dns=%{time_namelookup} connect=%{time_connect} tls=%{time_appconnect} ttfb=%{time_starttransfer} total=%{time_total} ip=%{remote_ip}\n" https://www.kimiazivar.com/ || echo "try=$i FAILED"
            sleep 2
          done
