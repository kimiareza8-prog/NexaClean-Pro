name: Build KDA 1.1.3 profiler

on:
  push:
    branches: [kda-releases]
    paths:
      - '.github/workflows/kda-build-113.yml'

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build profiler release
        shell: python
        run: |
          import pathlib, zipfile, shutil, hashlib
          src=pathlib.Path('kda/kimiya-diagnostic-agent-v1.1.2.zip')
          work=pathlib.Path('/tmp/kda113')
          if work.exists(): shutil.rmtree(work)
          work.mkdir()
          with zipfile.ZipFile(src,'r') as z: z.extractall(work)
          root=work/'kimiya-diagnostic-agent'
          shutil.copy2('kda/patches/class-kda-profiler.php', root/'includes/class-kda-profiler.php')

          p=root/'kimiya-diagnostic-agent.php'
          s=p.read_text()
          s=s.replace('Version: 1.1.2','Version: 1.1.3')
          s=s.replace("define('KDA_VERSION', '1.1.2');","define('KDA_VERSION', '1.1.3');")
          s=s.replace("require_once KDA_DIR . 'includes/class-kda-security.php';\n", "require_once KDA_DIR . 'includes/class-kda-security.php';\nrequire_once KDA_DIR . 'includes/class-kda-profiler.php';\n")
          s=s.replace("KDA_Updater::maybe_migrate_settings();\n", "KDA_Profiler::bootstrap();\nKDA_Updater::maybe_migrate_settings();\n")
          marker="""        register_rest_route('kda/v1', '/signed-report', array(
            'methods' => WP_REST_Server::READABLE,
            'callback' => array($this, 'rest_report'),
            'permission_callback' => array('KDA_Security', 'authorize_signed_report_request'),
        ));
"""
          addition=marker+"""        register_rest_route('kda/v1', '/signed-profile', array(
            'methods' => WP_REST_Server::READABLE,
            'callback' => array($this, 'rest_profile'),
            'permission_callback' => array('KDA_Security', 'authorize_signed_profile_request'),
        ));
"""
          if marker not in s: raise SystemExit('signed-report route marker missing')
          s=s.replace(marker,addition,1)
          marker2="    public function rest_errors() {\n"
          repl2="    public function rest_profile() {\n        return $this->no_store(array('meta' => array('agent_version' => KDA_VERSION, 'read_only' => true, 'generated_utc' => gmdate('c')), 'homepage_profile' => KDA_Profiler::run_home_profile()));\n    }\n\n"+marker2
          if marker2 not in s: raise SystemExit('rest_errors marker missing')
          s=s.replace(marker2,repl2,1)
          p.write_text(s)

          sec=root/'includes/class-kda-security.php'
          t=sec.read_text()
          needle="    public static function authorize_signed_update_trigger($request) {\n"
          method="""    public static function authorize_signed_profile_request($request) {
        if (!function_exists('sodium_crypto_sign_verify_detached')) {
            return new WP_Error('kda_no_sodium', 'PHP Sodium extension is required.', array('status' => 503));
        }
        $ts = (int)$request->get_param('ts');
        $nonce = trim((string)$request->get_param('nonce'));
        $sig_text = trim((string)$request->get_param('sig'));
        if (!$ts || abs(time() - $ts) > 600 || !preg_match('/^[A-Za-z0-9_-]{20,128}$/', $nonce) || !$sig_text) {
            return new WP_Error('kda_signed_profile_invalid', 'Invalid or expired signed profile request.', array('status' => 403));
        }
        $nonce_key = 'kda_signed_profile_nonce_' . substr(hash('sha256', $nonce), 0, 32);
        if (get_transient($nonce_key)) {
            return new WP_Error('kda_signed_profile_replay', 'Signed profile request was already used.', array('status' => 409));
        }
        $pub = base64_decode((string)get_option('kda_update_public_key', KDA_DEFAULT_PUBLIC_KEY), true);
        $sig = self::decode_b64url($sig_text);
        if ($pub === false || strlen($pub) !== SODIUM_CRYPTO_SIGN_PUBLICKEYBYTES || $sig === false || strlen($sig) !== SODIUM_CRYPTO_SIGN_BYTES) {
            return new WP_Error('kda_signed_profile_signature_format', 'Invalid signature format.', array('status' => 403));
        }
        $payload = "profile\n" . $ts . "\n" . $nonce;
        if (!sodium_crypto_sign_verify_detached($sig, $payload, $pub)) {
            return new WP_Error('kda_signed_profile_signature', 'Invalid signed profile signature.', array('status' => 403));
        }
        set_transient($nonce_key, 1, 15 * MINUTE_IN_SECONDS);
        return true;
    }

"""
          if needle not in t: raise SystemExit('update auth marker missing')
          t=t.replace(needle,method+needle,1)
          sec.write_text(t)

          readme=root/'readme.txt'
          r=readme.read_text().replace('Stable tag: 1.1.2','Stable tag: 1.1.3')
          r += "\n= 1.1.3 =\n* Added signed, read-only homepage profiler for WordPress phases, SQL timings, and outbound HTTP calls.\n"
          readme.write_text(r)

          out=pathlib.Path('kda/kimiya-diagnostic-agent-v1.1.3.zip')
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED) as z:
              for f in sorted(root.rglob('*')):
                  if f.is_file():
                      arc=pathlib.Path('kimiya-diagnostic-agent')/f.relative_to(root)
                      z.write(f,arc.as_posix())
          sha=hashlib.sha256(out.read_bytes()).hexdigest()
          pathlib.Path('kda/sha256-1.1.3.txt').write_text(sha+'\n')
          print(out, out.stat().st_size, sha)
      - name: PHP lint
        run: |
          rm -rf /tmp/kda113lint
          mkdir /tmp/kda113lint
          unzip -q kda/kimiya-diagnostic-agent-v1.1.3.zip -d /tmp/kda113lint
          find /tmp/kda113lint -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Commit package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kda/kimiya-diagnostic-agent-v1.1.3.zip kda/sha256-1.1.3.txt
          git commit -m "Build KDA v1.1.3 profiler package [skip ci]"
          git push
