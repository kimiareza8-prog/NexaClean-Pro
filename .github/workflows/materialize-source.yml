name: Materialize Python Source

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/NexaClean_Pro.py.gz.b64'
      - '.github/workflows/materialize-source.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode source
        run: |
          python - <<'PY'
          import base64, gzip, pathlib
          payload = pathlib.Path('src/NexaClean_Pro.py.gz.b64').read_text(encoding='ascii').strip()
          data = gzip.decompress(base64.b64decode(payload))
          pathlib.Path('NexaClean_Pro.py').write_bytes(data)
          PY

      - name: Commit materialized source
        shell: bash
        run: |
          if git diff --quiet -- NexaClean_Pro.py && git ls-files --error-unmatch NexaClean_Pro.py >/dev/null 2>&1; then
            echo "Source is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NexaClean_Pro.py
          git commit -m "Materialize NexaClean Pro 3.4 source"
          git push
